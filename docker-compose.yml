services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-envios-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sistema-envios:
    image: ghcr.io/diego-dell/web_transportadoras:latest
    container_name: sistema-envios
    restart: always
    ports:
      - "127.0.0.1:14400:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  adminer:
    image: adminer:latest
    container_name: sistema-envios-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: sistema-envios-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sistema-envios
      - adminer

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-sistema-envios
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup --label-enable

volumes:
  pgdata:
  caddy_data:
  caddy_config:
